<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Delta Dunării · DELTA-Hub</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#060d17">
<script type="importmap">{"imports":{"three":"./shared/vendor/three.module.js"}}</script>
<link rel="stylesheet" href="shared/ui.css">
<style>
/* Main screen: a cosmic delta (shared/hubflow.js: sparkles, nebula, stars, slow camera float), the 4 stories pinned where they happen. */
body{background:#030814}
#flow{position:fixed;inset:0}
#flow canvas{display:block}
#links{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:2}
#links line{stroke:rgba(232,193,112,.42);stroke-width:1.3;stroke-dasharray:2 6}

#head{position:fixed;left:calc(var(--u)*2.2);top:calc(var(--u)*1.8);z-index:3;pointer-events:none}
#head::before{content:'';position:absolute;z-index:-1;left:calc(var(--u)*-6);top:calc(var(--u)*-5);width:calc(var(--u)*44);height:calc(var(--u)*24);
  background:radial-gradient(ellipse at 35% 40%,rgba(3,7,18,.82) 0%,rgba(3,7,18,.55) 45%,rgba(3,7,18,0) 72%);pointer-events:none}   /* keeps the title readable over the bright branches */
#head .sub{text-shadow:0 1px 10px rgba(0,0,0,.9)}
#head .brand{font-size:calc(var(--u)*.95);font-weight:700;letter-spacing:.04em}
#head .brand span{color:var(--ink3);font-weight:400;letter-spacing:.16em;text-transform:uppercase;font-size:.78em;margin-left:.8em}
#head h1{margin:.25em 0 .12em;font-size:calc(var(--u)*4.2);font-weight:250;letter-spacing:-.01em;line-height:1;text-shadow:0 4px 30px rgba(0,0,0,.6)}
#head .sub{font-size:calc(var(--u)*1.2);color:var(--ink2);max-width:calc(var(--u)*30);line-height:1.4}
#head .tap{display:inline-flex;align-items:center;gap:.6em;margin-top:calc(var(--u)*1.2);font-size:calc(var(--u)*1.1);font-weight:600;color:var(--sand);
  padding:.55em 1.2em;border-radius:99px;border:1px solid rgba(232,193,112,.6);background:rgba(6,13,23,.5);animation:dhpulse 2.4s infinite}

#top{position:fixed;right:calc(var(--u)*2.2);top:calc(var(--u)*1.8);z-index:5;display:flex;gap:calc(var(--u)*.7)}
#top .bt{background:rgba(6,13,23,.6);border:1px solid var(--line)}

/* story pins on the map */
.pin{position:fixed;left:0;top:0;z-index:7;width:calc(var(--u)*2.6);height:calc(var(--u)*2.6);margin:calc(var(--u)*-1.3) 0 0 calc(var(--u)*-1.3);will-change:transform;border-radius:50%;
  display:grid;place-items:center;background:var(--sand);color:#1a1206;font-weight:800;font-size:calc(var(--u)*1.15);cursor:pointer;
  box-shadow:0 0 0 calc(var(--u)*.25) rgba(6,13,23,.7),0 0 calc(var(--u)*1.6) rgba(255,205,110,.9)}
.pin::before,.pin::after{content:'';position:absolute;inset:-10%;border-radius:50%;border:2px solid rgba(255,208,120,.9);animation:bubring 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.pin::after{animation-delay:1.2s}
@keyframes bubring{0%{transform:scale(.8);opacity:1}100%{transform:scale(2.4);opacity:0}}

/* story cards: animated thumbnail + title + line + start. They sit in a perspective layer (#cards) that drifts a little
   against the camera float (parallax), and each one floats on its own slow cycle (translate / rotate, not transform). */
#cards{position:fixed;inset:0;z-index:4;pointer-events:none;perspective:1600px;transform:translate3d(var(--px,0px),var(--py,0px),0)}
.sc{position:absolute;z-index:4;pointer-events:auto;width:calc(var(--u)*27);display:flex;gap:calc(var(--u)*1);padding:calc(var(--u)*.8);border-radius:calc(var(--u)*1.1);text-align:left;
  background:linear-gradient(160deg,rgba(22,40,66,.50),rgba(8,16,30,.42));border:1px solid rgba(200,225,250,.22);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),inset 0 1px 18px rgba(140,190,255,.07),0 0 26px rgba(110,160,255,.10),0 18px 50px rgba(0,0,0,.32);
  backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);
  opacity:0;transform:translateY(16px);transition:opacity .8s,transform .8s var(--ease),border-color .3s}
body.on .sc{opacity:1;transform:none;animation:scfloat var(--fd,12s) ease-in-out var(--fdel,0s) infinite}
@keyframes scfloat{0%,100%{translate:0 0 0;rotate:1 -.6 0 0deg}25%{translate:calc(var(--u)*.35) calc(var(--u)*-.5) 18px;rotate:1 -.6 0 2.2deg}50%{translate:calc(var(--u)*-.15) calc(var(--u)*-.85) 30px;rotate:-.4 1 0 2.6deg}75%{translate:calc(var(--u)*-.4) calc(var(--u)*-.35) 12px;rotate:-1 .3 0 1.6deg}}
body.on .sc:nth-of-type(2){transition-delay:.1s} body.on .sc:nth-of-type(3){transition-delay:.2s} body.on .sc:nth-of-type(4){transition-delay:.3s}
.sc:active{transform:scale(.98)!important;border-color:var(--sand)}
.sc.rec{border-color:rgba(232,193,112,.45)}
.sc .im{width:calc(var(--u)*12);flex:none;aspect-ratio:16/9;border-radius:calc(var(--u)*.6);overflow:hidden;position:relative;align-self:center;background:#0b1826}
.sc .im img{width:100%;height:100%;object-fit:cover;display:block}
.sc .im b{position:absolute;left:calc(var(--u)*.4);top:calc(var(--u)*.4);width:calc(var(--u)*1.9);height:calc(var(--u)*1.9);border-radius:50%;display:grid;place-items:center;
  background:var(--sand);color:#1a1206;font-size:calc(var(--u)*1);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.sc .im.ph1{background:repeating-radial-gradient(ellipse at 60% 130%,rgba(143,194,74,.22) 0 2px,transparent 2px 24px),#0b1826}
.sc .im.ph2{background:repeating-radial-gradient(ellipse at 30% 120%,rgba(79,195,232,.22) 0 2px,transparent 2px 26px),#0b1826}
.sc .im.ph3{background:repeating-radial-gradient(circle at 85% 95%,rgba(232,193,112,.24) 0 2px,transparent 2px 22px),#0b1826}
.sc .im.ph4{background:repeating-linear-gradient(100deg,rgba(150,212,245,.18) 0 2px,transparent 2px 24px),#0b1826}
.sc .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.sc h2{margin:0;font-size:calc(var(--u)*1.3);font-weight:650;line-height:1.12}
.sc p{margin:.3em 0 .55em;font-size:calc(var(--u)*.8);line-height:1.38;color:var(--ink2)}
.sc .go{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:.45em;padding:.5em 1em;border-radius:99px;background:var(--sand);color:#1a1206;
  font-weight:700;letter-spacing:.05em;font-size:calc(var(--u)*.82);white-space:nowrap}
.sc .go svg{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sc .m{font-size:calc(var(--u)*.66);color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-top:.15em}


#about{position:fixed;right:calc(var(--u)*2.2);bottom:calc(var(--u)*2.2);z-index:6;width:calc(var(--u)*29);display:flex;gap:calc(var(--u)*1);
  padding:calc(var(--u)*1.1) calc(var(--u)*1.3);font-size:calc(var(--u)*.74);line-height:1.5;color:var(--ink2);background:rgba(6,12,24,.62);
  border-color:rgba(190,215,235,.14);opacity:0;transition:opacity 1.2s .6s}
body.on #about{opacity:1}
#about .k{font-size:calc(var(--u)*.66);letter-spacing:.2em;text-transform:uppercase;color:var(--sand);font-weight:700;margin-bottom:.45em}
#about p{margin:0 0 .5em}
#about #abW{color:var(--ink);font-size:1.06em}
#about #abC{color:var(--ink);margin-bottom:.35em}
#about .lnk{color:#8fd0ff;letter-spacing:.03em;font-weight:600}
#about .lnk a{color:inherit;text-decoration:none}
/* follow DELTA-Hub (bottom left): the three social accounts stacked, a QR code + link to the 3D Experience page on the website */
#follow{--fu:calc(var(--u)*.7);   /* the box's own unit: 30 % smaller than the rest of the screen */
  position:fixed;left:calc(var(--u)*2.2);bottom:calc(var(--u)*2.2);z-index:6;display:flex;align-items:center;gap:calc(var(--fu)*1.3);
  padding:calc(var(--fu)*1.1) calc(var(--fu)*1.3);background:rgba(6,12,24,.62);border-color:rgba(190,215,235,.14);opacity:0;transition:opacity 1.2s .6s}
body.on #follow{opacity:1}
#follow h3{margin:0;padding-bottom:calc(var(--fu)*.45);border-bottom:1px solid rgba(238,244,248,.3);font-size:calc(var(--fu)*1.3);font-weight:700;
  letter-spacing:-.01em;color:#7fbf9e}
#follow .so{display:flex;align-items:center;gap:calc(var(--fu)*.8);width:calc(var(--fu)*15);margin-top:calc(var(--fu)*.55);padding:calc(var(--fu)*.6) calc(var(--fu)*.8);
  border-radius:calc(var(--fu)*.75);color:#fff;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#follow .so i{flex:none;width:calc(var(--fu)*2.3);height:calc(var(--fu)*2.3);border-radius:calc(var(--fu)*.55);display:grid;place-items:center;background:rgba(255,255,255,.18)}
#follow .so svg{width:calc(var(--fu)*1.25);height:calc(var(--fu)*1.25);fill:#fff}
#follow .so b{display:block;font-size:calc(var(--fu)*1.05);font-weight:700;line-height:1.15}
#follow .so em{display:block;margin-top:.15em;font-style:normal;font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:calc(var(--fu)*.78);opacity:.92}
#follow .li{background:linear-gradient(120deg,#0a66c2,#0b4f99)}
#follow .fb{background:linear-gradient(120deg,#1877f2,#1460cc)}
#follow .ig{background:linear-gradient(115deg,#5851db 0%,#833ab4 30%,#c13584 55%,#e1306c 70%,#fd8d32 88%,#fcd36b 100%)}
#follow .fq{flex:none;width:calc(var(--fu)*8.6);text-align:center}
#follow .fq:has(#qr:empty){display:none}
#qr canvas{width:100%;height:auto;border-radius:6px;display:block}
#follow .qt{margin-top:calc(var(--fu)*.6);font-size:calc(var(--fu)*.74);line-height:1.35;color:var(--ink)}
#follow .ql{margin-top:.35em;font-size:calc(var(--fu)*.68);line-height:1.3;font-weight:600;color:#8fd0ff;letter-spacing:.02em}
#follow .ql a{color:inherit;text-decoration:none}
#err{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--ink3);font-size:calc(var(--u)*.9);display:none}

/* phones (kiosk.js PHONE_MQ): the cosmic delta stays as a fixed background, the stories scroll over it as a list */
@media (max-width:820px), (max-height:500px){
  body{touch-action:pan-y;overflow:auto}
  html{overflow:auto}
  #links,.pin{display:none}
  #head::before{display:none}
  #head .sub{text-shadow:0 1px 8px rgba(0,0,0,.95)}
  #head{position:relative;z-index:3;left:auto;top:auto;padding:18px 70px 8px 14px}   /* relative: above the fixed cosmic canvas */
  #head h1{font-size:40px}
  #cards{position:static;transform:none;perspective:none}
  .sc{position:static;width:auto;margin:10px 12px;opacity:1;transform:none;animation:none!important}
  #about{position:static;width:auto;margin:10px 12px 20px;opacity:1}
  #follow{--fu:var(--u);position:static;margin:0 12px 20px;opacity:1;padding:14px 16px}   /* full size: the phone's unit is small already */
  #follow>div:first-child{flex:1}
  #follow .so{width:auto}
  #follow .fq{display:none}            /* the QR leads to the phone the visitor is already holding */
  #top{position:fixed;top:12px;right:12px}
}
@media (max-height:500px) and (min-width:560px){
  #cards{display:grid;grid-template-columns:1fr 1fr}
  .sc{margin:8px}
}
</style>
</head>
<body>
<div id="flow"></div>
<svg id="links"></svg>
<div id="head">
  <div class="brand">DELTA-Hub<span>Danube Delta · Digital Twin</span></div>
  <h1 id="hT"></h1>
  <div class="sub" id="hS"></div>
  <div class="tap" id="hTap"></div>
</div>
<div id="top"><button class="bt txt" id="bLang"></button></div>
<div id="cards"></div>
<div id="err"></div>
<div id="about" class="glass"><div><div class="k" id="abT"></div><p id="abW"></p><p id="abB"></p><p id="abC"></p><div class="lnk" id="abL"></div></div></div>
<div id="follow" class="glass"><div><h3 id="flT"></h3><div id="flS"></div></div><div class="fq"><div id="qr"></div><div class="qt" id="flQ"></div><div class="ql" id="flL"></div></div></div>

<script src="shared/vendor/qrcode.js"></script>
<script type="module">
import { EXPO } from './shared/config.js';
import { KIOSK, getLang, toggleLang, onLang, resetLang, goStory, startIdle, ready, ICON, store, isPhone } from './shared/kiosk.js';

const $ = id => document.getElementById(id);
const T = {
  ro: { t: 'Delta Dunării', s: 'Patru povești despre cum s-a născut delta, cum respiră cu apele Dunării și cum se mișcă țărmul ei.',
        tap: 'Atinge o poveste ca să începi', start: 'Începe', soon: 'În curând', lang: 'EN', about: 'Despre',
        aboutW: 'DELTA-Hub, împreună cu Water Lab, aduce aici pentru public cercetarea despre Delta Dunării: modele ale apei și ale sedimentelor, măsurători din teren și imagini din satelit.',
        aboutC: '© Florin Zăinescu, cu ajutorul lui Florin Miron',
        aboutB: 'DELTA-Hub este un proiect Horizon Europe ERA Chairs al Universității din București care construiește un geamăn digital al Deltei Dunării: modele hidrodinamice și morfodinamice, date LiDAR și satelitare, observații de teren. Poveștile de aici sunt construite din aceste date și modele.',
        follow: 'Urmărește DELTA-Hub', qr: 'Experiența 3D interactivă, pe site: fotografiază codul cu telefonul.',
        meta: ['≈ 5 min · 7 opriri', 'Model hidrodinamic · secetă și viitură', 'Hărți și sateliți · 1898–2025', 'Batimetrii 2004–2017'] },
  en: { t: 'The Danube Delta', s: 'Four stories of how the delta was born, how it breathes with the Danube’s waters and how its coast moves.',
        tap: 'Touch a story to begin', start: 'Start', soon: 'Coming soon', lang: 'RO', about: 'About',
        aboutW: 'DELTA-Hub, together with Water Lab, brings research on the Danube Delta to the public: models of water and sediment, field measurements and satellite images.',
        aboutC: '© Florin Zăinescu, with the help of Florin Miron',
        aboutB: 'DELTA-Hub is a Horizon Europe ERA Chairs project of the University of Bucharest building a digital twin of the Danube Delta: hydrodynamic and morphodynamic models, LiDAR and satellite data, field observations. The stories here are built from these data and models.',
        follow: 'Follow DELTA-Hub', qr: 'The interactive 3D experience on our website: scan the code with your phone.',
        meta: ['≈ 5 min · 7 stops', 'Hydrodynamic model · drought and flood', 'Maps and satellites · 1898–2025', 'Surveys 2004–2017'] }
};
// where each card sits (fractions of the window: left/top of the card) — next to its pin, around the delta
const CARD_AT = [{ x: .14, y: .40 }, { x: .63, y: .12 }, { x: .42, y: .76 }, { x: .70, y: .41 }];
// the map: the delta's water fills this part of the window
// Sacalin and the mouth are 5 km apart: their pins are pulled apart a little (in --u units) so both can be touched
const PIN_NUDGE = [null, null, [-2.2, 1.1], [1.1, -1.9]];
const MAP_RECT = () => ({ x: innerWidth * .157, y: innerHeight * -.03, w: innerWidth * .686, h: innerHeight * 1.17 });   // zoomed in; the apex (pin 1) clear of the title, the mouth clear of the about box   // zoomed in: the delta fills the screen behind the cards

/* ---- reset after the idle return or a visitor leaving: language back to RO, bubble hints again */
const Q = new URLSearchParams(location.search);
if (Q.has('reset')) { resetLang(); history.replaceState(null, '', location.pathname + (KIOSK ? '' : '')); }
store.del('dh_bubok');

/* ---- cards + pins */
const cards = [], pins = [];
EXPO.stories.forEach((s, i) => {
  const c = document.createElement('button'); c.className = 'sc' + (i === 0 ? ' rec' : '');
  c.onclick = () => goStory(i, '');
  c.style.setProperty('--fd', (10 + i * 1.7 + Math.random() * 2).toFixed(1) + 's'); c.style.setProperty('--fdel', (-Math.random() * 10).toFixed(1) + 's');
  $('cards').appendChild(c); cards.push(c);
  const p = document.createElement('div'); p.className = 'pin'; p.textContent = i + 1; p.onclick = () => goStory(i, '');
  document.body.appendChild(p); pins.push(p);
});
function setText() {
  const L = getLang(), X = T[L];
  $('hT').textContent = X.t; $('hS').textContent = X.s; $('hTap').textContent = X.tap;
  $('bLang').textContent = X.lang; $('abT').textContent = X.about; $('abB').textContent = X.aboutB;
  $('abW').textContent = X.aboutW; $('abC').textContent = X.aboutC;
  $('flT').textContent = X.follow; $('flQ').textContent = X.qr;
  // the kiosk must not leave the app: plain text there, a link on the web
  $('abL').innerHTML = KIOSK ? 'delta-hub.unibuc.ro' : '<a href="https://delta-hub.unibuc.ro" target="_blank" rel="noopener">delta-hub.unibuc.ro</a>';
  EXPO.stories.forEach((s, i) => {
    cards[i].innerHTML = `<div class="im ph${i + 1}"><img alt="" src="shared/img/story_${i + 1}.webp" onerror="this.remove()"><b>${i + 1}</b></div>
      <div class="tx"><h2>${EXPO.names[L][i]}</h2><div class="m">${X.meta[i]}</div><p>${EXPO.blurbs[L][i]}</p>
      <span class="go">${s.ready ? X.start + ' ' + ICON.next : X.soon}</span></div>`;
  });
  layout();
}

/* ---- the cosmic background + layout: cards placed on resize, pins and dashed links follow the floating camera every frame */
let flow = null, uPx = 18;
const svg = $('links'), lines = EXPO.stories.map(() => { const l = document.createElementNS('http://www.w3.org/2000/svg', 'line'); svg.appendChild(l); return l; });
function layout() {
  const W = innerWidth, H = innerHeight;
  if (isPhone()) { if (flow) flow.frame({ x: W * .04, y: H * .06, w: W * .92, h: H * .88 }); return; }   // phones: the whole delta behind the list
  uPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 18;
  EXPO.stories.forEach((s, i) => { cards[i].style.left = (CARD_AT[i].x * W) + 'px'; cards[i].style.top = (CARD_AT[i].y * H) + 'px'; });
  if (flow) flow.frame(MAP_RECT());
  c0 = null; pinsUpdate();
}
let c0 = null;
function pinsUpdate() {
  if (isPhone()) return;
  if (flow) {                                          // the cards layer drifts against the camera float (parallax: they sit above the delta)
    const m = flow.toScreen(flow.centre.x, flow.centre.z);
    if (!c0) c0 = m;
    document.body.style.setProperty('--px', (-(m.x - c0.x) * 0.35).toFixed(1) + 'px'); document.body.style.setProperty('--py', (-(m.y - c0.y) * 0.35).toFixed(1) + 'px');
  }
  EXPO.stories.forEach((s, i) => {
    if (!flow) { pins[i].style.display = 'none'; lines[i].style.display = 'none'; return; }
    const w = flow.world(s.at[0], s.at[1]), p = flow.toScreen(w.x, w.z);
    if (PIN_NUDGE[i]) { p.x += PIN_NUDGE[i][0] * uPx; p.y += PIN_NUDGE[i][1] * uPx; }
    pins[i].style.display = ''; pins[i].style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px)`;
    const r = cards[i].getBoundingClientRect();        // the floating card where it is now
    const ex = p.x < r.left ? r.left : p.x > r.right ? r.right : p.x, ey = Math.max(r.top + 12, Math.min(r.bottom - 12, p.y));
    const inside = p.x > r.left && p.x < r.right && p.y > r.top && p.y < r.bottom;
    lines[i].style.display = inside ? 'none' : '';
    lines[i].setAttribute('x1', p.x.toFixed(1)); lines[i].setAttribute('y1', p.y.toFixed(1)); lines[i].setAttribute('x2', ex); lines[i].setAttribute('y2', ey);
  });
}
addEventListener('resize', layout);

$('bLang').onclick = () => toggleLang();
onLang(setText);

/* ---- follow DELTA-Hub: social accounts (links on the web, plain cards in the kiosk, which must not leave the app) + QR code */
const SOCIAL_ICON = {

if (KIOSK) $('follow').style.pointerEvents = 'none';   // the exhibition table: look, photograph the QR, but nothing to touch
$('flS').innerHTML = (EXPO.social || []).map(s => {
  const inner = `<i><svg viewBox="0 0 24 24" aria-hidden="true">${SOCIAL_ICON[s.id] || ''}</svg></i><span><b>${s.name}</b><em>${s.handle}</em></span>`;
  return KIOSK ? `<div class="so ${s.id}">${inner}</div>` : `<a class="so ${s.id}" href="${s.url}" target="_blank" rel="noopener">${inner}</a>`;
}).join('');
if (EXPO.webPage && window.qrcode) {
  const q = qrcode(0, 'M'); q.addData(EXPO.webPage); q.make();
  const n = q.getModuleCount(), c = document.createElement('canvas'), k = 8; c.width = c.height = (n + 4) * k;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#060d17';
  for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) if (q.isDark(r, cc)) x.fillRect((cc + 2) * k, (r + 2) * k, k, k);
  $('qr').appendChild(c);
  const label = EXPO.webPage.replace(/^https?:\/\//, '').replace('/', '/<wbr>');
  $('flL').innerHTML = KIOSK ? label : `<a href="${EXPO.webPage}" target="_blank" rel="noopener">${label}</a>`;
}
setText();
// main screen idle (kiosk): no popup — back to RO, panels closed, bubble hints armed again
startIdle(() => { resetLang(); store.del('dh_bubok'); }, { popup: false });

import('./shared/hubflow.js').then(m => m.hubFlow($('flow'), { base: 'shared/data/', onFrame: () => pinsUpdate(), lite: isPhone() }))
  .then(f => { flow = f; layout(); })
  .catch(e => { console.error(e); $('err').textContent = 'Fundalul nu s-a putut încărca: ' + e.message; $('err').style.display = 'block'; layout(); })
  .finally(() => { document.body.classList.add('on'); ready(); });
