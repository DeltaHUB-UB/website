<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lupta de la gură · DELTA-Hub</title>
<meta name="theme-color" content="#060d17">
<script type="importmap">{"imports":{"three":"../../shared/vendor/three.module.js"}}</script>
<link rel="stylesheet" href="../../shared/ui.css">
<style>
#app{position:fixed;inset:0}
body{background:var(--bg)}
canvas{display:block}
:root{--dep:#f2b33d;--ero:#e8452e;--seac:#3d8bff}

/* map labels */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;transition:opacity .6s;font-weight:600;
  text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.6);font-size:calc(var(--u)*1.0);letter-spacing:.02em}
.lbl.on{opacity:1}
.lbl.sea{font-style:italic;font-weight:400;color:#a9d3f2;font-size:calc(var(--u)*1.25);letter-spacing:.2em;text-transform:uppercase}
.lbl.land{color:#e6dcc0;font-weight:400;letter-spacing:.18em;text-transform:uppercase;font-size:calc(var(--u)*.9)}
.lbl.town{color:#fff;font-size:calc(var(--u)*.9)}
.lbl.town::before{content:'';display:inline-block;width:.55em;height:.55em;border-radius:50%;background:#fff;margin-right:.4em;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.lbl.feat{color:var(--sand);font-size:calc(var(--u)*1.0)}
.lbl.riv{color:#9fd4ff;font-style:italic;font-weight:500;font-size:calc(var(--u)*.85);letter-spacing:.04em}
.lbl.lake{color:#bfe3ff;font-style:italic;font-weight:600;font-size:calc(var(--u)*.95);letter-spacing:.04em}

/* top: date, brand, event toast */
#time{position:fixed;top:calc(var(--u)*1.2);left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
#tbig{font-size:calc(var(--u)*3.2);font-weight:300;letter-spacing:.02em;text-shadow:0 2px 14px rgba(0,0,0,.7);white-space:nowrap;font-variant-numeric:tabular-nums}
#tbig.small{font-size:calc(var(--u)*2.3)}
#tsmall{font-size:calc(var(--u)*.95);color:var(--ink2);margin-top:.05em;text-shadow:0 1px 8px rgba(0,0,0,.8);white-space:nowrap;min-height:1.3em}
#brand{position:fixed;top:calc(var(--u)*1.2);left:calc(var(--u)*1.4);pointer-events:none}
#brand .t{font-size:calc(var(--u)*1.25);font-weight:700;letter-spacing:.02em}
#brand .s{font-size:calc(var(--u)*.78);color:var(--ink3);letter-spacing:.14em;text-transform:uppercase;margin-top:.2em}
#toast{position:fixed;top:calc(var(--u)*11.2);left:50%;transform:translateX(-50%);padding:.55em 1.1em;border-radius:99px;font-size:calc(var(--u)*1.05);
  background:rgba(6,13,23,.82);border:1px solid var(--line);white-space:nowrap;opacity:0;transition:opacity .45s;pointer-events:none;z-index:8}
#toast b{font-weight:700} #toast span{color:var(--ink3);font-size:.85em}
#toast.flood{border-color:rgba(242,179,61,.6)} #toast.storm{border-color:rgba(61,139,255,.7)}
#vtick{position:fixed;left:50%;top:calc(var(--u)*7.1);transform:translateX(-50%);z-index:5;pointer-events:none;font-size:calc(var(--u)*1.6);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
  padding:.2em .6em;border-radius:99px;background:rgba(6,13,23,.72);border:1px solid var(--line);opacity:0;transition:opacity .5s;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#vtick.on{opacity:1} #vtick.pos{color:var(--dep);border-color:rgba(242,179,61,.55)} #vtick.neg{color:#ff6b55;border-color:rgba(232,69,46,.6)}
#vtick small{display:block;font-size:.42em;font-weight:500;color:var(--ink2);letter-spacing:.06em;text-align:center}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:3px;margin-right:.45em;vertical-align:-.05em}
.sw.dep{background:var(--dep)} .sw.ero{background:var(--ero)} .sw.sea{background:var(--seac)}

/* the duel (top right): river vs sea, right now */
#duel{position:fixed;right:calc(var(--u)*1.4);top:calc(var(--u)*1.2);width:min(31vw,calc(var(--u)*27));padding:calc(var(--u)*.8) calc(var(--u)*1.0) calc(var(--u)*.7)}
#duel .row{display:flex;justify-content:space-between;align-items:flex-end}
#duel .side{display:flex;flex-direction:column;gap:.1em}
#duel .side b{font-size:calc(var(--u)*.72);letter-spacing:.16em;text-transform:uppercase;font-weight:700}
#duel .side span{font-size:calc(var(--u)*1.35);font-weight:300;font-variant-numeric:tabular-nums;white-space:nowrap}
#duel .riv b{color:var(--dep)} #duel .sea{text-align:right} #duel .sea b{color:var(--seac)}
#tug{position:relative;height:calc(var(--u)*.7);margin:calc(var(--u)*.55) 0 calc(var(--u)*.35);border-radius:99px;display:flex;overflow:visible}
#tugR,#tugS{flex:1;transition:opacity .4s} #tugR{background:linear-gradient(90deg,var(--dep),rgba(242,179,61,.25));border-radius:99px 0 0 99px}
#tugS{background:linear-gradient(90deg,rgba(61,139,255,.25),var(--seac));border-radius:0 99px 99px 0}
#tugknob{position:absolute;top:50%;left:50%;width:calc(var(--u)*1.25);height:calc(var(--u)*1.25);margin:calc(var(--u)*-.625) 0 0 calc(var(--u)*-.625);border-radius:50%;
  background:#fff;box-shadow:0 0 0 3px rgba(6,13,23,.8),0 0 14px rgba(255,255,255,.8);transition:left .35s var(--ease)}
#dState{text-align:center;font-size:calc(var(--u)*.9);color:var(--ink2);min-height:1.3em}
#dState.riv{color:var(--dep)} #dState.sea{color:#8cbcff}
#legend{margin-top:calc(var(--u)*.5);padding-top:calc(var(--u)*.45);border-top:1px solid var(--line);font-size:calc(var(--u)*.74);color:var(--ink3);display:flex;flex-wrap:wrap;gap:.3em 1em;align-items:center;transition:opacity .5s}
#legend #lRef{flex:1 1 100%;color:var(--ink2)}

/* story card */
#card{position:fixed;z-index:7;left:calc(var(--u)*1.4);bottom:calc(var(--u)*8.4);width:min(33vw,calc(var(--u)*30));padding:calc(var(--u)*1.3) calc(var(--u)*1.5);transition:opacity .5s}
#card.in{animation:cardin .8s var(--ease)}
@keyframes cardin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#kicker{font-size:calc(var(--u)*.78);letter-spacing:.18em;text-transform:uppercase;color:var(--sand);font-weight:600}
#ctitle{font-size:calc(var(--u)*1.95);font-weight:650;line-height:1.12;margin:.3em 0 .45em}
#cbody{font-size:calc(var(--u)*1.0);line-height:1.5;color:var(--ink2)}
#cfact{margin-top:.9em;display:inline-block;font-size:calc(var(--u)*.92);padding:.45em .9em;border-radius:99px;background:rgba(232,193,112,.14);color:var(--sand);border:1px solid rgba(232,193,112,.35);font-variant-numeric:tabular-nums}
#chint{margin-top:1em;font-size:calc(var(--u)*.86);color:var(--ink3);display:flex;align-items:center;gap:.6em}
#chint:empty{display:none}
#chint .dot{width:1.1em;height:1.1em;border-radius:50%;background:var(--sand);box-shadow:0 0 10px rgba(232,193,112,.8);flex:none}
#cfocus{margin-top:1em;padding:.8em 1em;border-radius:calc(var(--u)*.6);background:rgba(255,255,255,.06);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.25em 1em;align-items:baseline;font-size:calc(var(--u)*.92)}
#cfocus b{font-weight:600} #cfocus .pos{color:var(--dep);font-weight:700} #cfocus .neg{color:#ff6b55;font-weight:700}
#cfocus em{flex:1 1 100%;font-style:normal;color:var(--ink3);font-size:.9em}
#cend{margin-top:1.1em;display:flex;gap:calc(var(--u)*.6);flex-wrap:wrap}
#cend .bt{height:calc(var(--u)*3)}

/* charts: a column on the right, between the duel and the bottom bar */
#charts{position:fixed;z-index:7;right:calc(var(--u)*1.4);top:calc(var(--u)*13.2);bottom:calc(var(--u)*8.4);width:min(31vw,calc(var(--u)*27));
  display:flex;flex-direction:column;gap:calc(var(--u)*.55);justify-content:flex-end;transition:opacity .5s}
.chart{padding:calc(var(--u)*.7) calc(var(--u)*1.0) calc(var(--u)*.5);min-height:0;transition:opacity .4s,box-shadow .4s;opacity:.8}
.chart.on{opacity:1;box-shadow:inset 3px 0 0 var(--sand)}
.chart .ctit{font-size:calc(var(--u)*.92);font-weight:650}
.chart .cunit{font-size:calc(var(--u)*.68);color:var(--ink3);margin-top:.1em}
.chart .cval{float:right;font-size:calc(var(--u)*1.15);font-weight:300;font-variant-numeric:tabular-nums;margin-top:-.1em;white-space:nowrap}
.chart svg{display:block;width:100%;height:auto;max-height:100%;margin-top:calc(var(--u)*.25);overflow:visible;touch-action:none}
.chart svg text{font-family:inherit;fill:var(--ink3);font-size:15px;font-variant-numeric:tabular-nums}
.chart svg .grid{stroke:rgba(190,215,235,.12);stroke-width:1}
.chart svg .ax{stroke:rgba(190,215,235,.35);stroke-width:1}
.chart svg .srv{stroke:rgba(255,255,255,.45);stroke-width:1.5}
.chart svg .cur{stroke:rgba(255,255,255,.9);stroke-width:2}
.chart svg .lab{fill:var(--ink2);font-size:14px}
.chart svg .hit{cursor:pointer}
.chart.touch{box-shadow:inset 3px 0 0 var(--sand),0 0 0 2px rgba(232,193,112,.35)}
.chart.touch svg .bar{animation:barpulse 2.2s infinite}
@keyframes barpulse{0%,100%{opacity:1}50%{opacity:.7}}

/* the Danube basin panel (last station) */
#basin{position:fixed;z-index:7;right:calc(var(--u)*1.4);top:calc(var(--u)*13.2);bottom:calc(var(--u)*8.4);width:min(52vw,calc(var(--u)*50));padding:calc(var(--u)*1.0) calc(var(--u)*1.2);
  display:none;flex-direction:column;gap:calc(var(--u)*.6)}
#basin.on{display:flex;animation:cardin .8s var(--ease)}
body.basin #charts,body.coast #charts{opacity:0;visibility:hidden;pointer-events:none}
#bTitle{font-size:calc(var(--u)*1.0);font-weight:650}
.bbars{display:flex;flex-direction:column;gap:calc(var(--u)*.4)}
.bb{display:grid;grid-template-columns:calc(var(--u)*11) 1fr;align-items:center;gap:calc(var(--u)*.6)}
.bb .bt{height:calc(var(--u)*2.6);justify-content:start;padding:0 .9em;font-size:calc(var(--u)*.85);border:1px solid var(--line)}
.bb .bt.on{background:rgba(232,193,112,.22);border-color:var(--sand)}
.bb .v{height:calc(var(--u)*1.5);border-radius:99px;background:linear-gradient(90deg,#e8a33d,#f6cf7a);position:relative;transition:opacity .4s}
.bb .v span{position:absolute;left:calc(100% + .6em);top:50%;transform:translateY(-50%);white-space:nowrap;font-size:calc(var(--u)*.85);color:var(--ink2);font-variant-numeric:tabular-nums}
#bmap{flex:1;min-height:0;width:100%;border-radius:calc(var(--u)*.6);background:rgba(3,8,14,.35)}
#bTrap{font-size:calc(var(--u)*.75);color:var(--ink3)}

/* bottom bar: ⌂ · ◀ · rail · ▶ · RO/EN · ⓘ */
#bar{position:fixed;left:calc(var(--u)*1.4);right:calc(var(--u)*1.4);bottom:calc(var(--u)*1.2);display:flex;align-items:center;gap:calc(var(--u)*.7);padding:calc(var(--u)*.55) calc(var(--u)*.7)}
#rail{flex:1;position:relative;height:calc(var(--u)*5.2);margin:0 calc(var(--u)*2.6);touch-action:none}
#track{position:absolute;left:0;right:0;top:calc(var(--u)*2.0);height:calc(var(--u)*.32);border-radius:99px;background:rgba(255,255,255,.12)}
#trackfill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,rgba(111,178,232,.7),var(--sand))}
.stn{position:absolute;top:0;width:calc(var(--u)*6.4);height:100%;margin-left:calc(var(--u)*-3.2);display:flex;flex-direction:column;align-items:center;padding:0}
.stn .d{margin-top:calc(var(--u)*1.43);width:calc(var(--u)*1.45);height:calc(var(--u)*1.45);border-radius:50%;background:#1b2c3d;border:2px solid rgba(255,255,255,.35);transition:all .3s}
.stn.past .d{background:var(--blue);border-color:var(--blue)}
.stn.cur .d{background:var(--sand);border-color:#fff;transform:scale(1.25);box-shadow:0 0 0 calc(var(--u)*.35) rgba(232,193,112,.25)}
.stn .a{position:absolute;top:0;font-size:calc(var(--u)*.78);font-weight:600;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.stn .n{margin-top:calc(var(--u)*.35);font-size:calc(var(--u)*.72);color:var(--ink3);white-space:nowrap;letter-spacing:.03em}
.stn.cur .a,.stn.cur .n{color:#fff}
.anc{position:absolute;top:calc(var(--u)*1.75);width:0;height:calc(var(--u)*.9);pointer-events:none}
.anc i{position:absolute;left:-1px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.4)}
.anc b{position:absolute;top:calc(var(--u)*-1.75);left:0;transform:translateX(-50%);white-space:nowrap;font-size:calc(var(--u)*.6);font-weight:500;color:var(--ink3);font-style:italic}
#train{position:absolute;top:calc(var(--u)*1.58);width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);margin-left:calc(var(--u)*-.6);border-radius:50%;
  background:#fff;box-shadow:0 0 14px rgba(255,255,255,.9);opacity:0;transition:opacity .3s;pointer-events:none}
body.travel #train{opacity:1}

/* about */
#about{position:fixed;inset:0;display:none;place-items:center;background:rgba(3,8,14,.6);z-index:20}
#about.on{display:grid}
#about .box{max-width:min(calc(var(--u)*56),86vw);padding:calc(var(--u)*1.6);font-size:calc(var(--u)*.88);line-height:1.55;color:var(--ink2)}
#about h3{margin:0 0 .6em;color:var(--ink);font-size:calc(var(--u)*1.2)}

/* loading */
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:var(--bg);transition:opacity .8s}
body.ready #loading{opacity:0;pointer-events:none}
#loading .w{width:min(calc(var(--u)*24),70vw);text-align:center}
#loading .t{font-size:calc(var(--u)*1.8);font-weight:300;margin-bottom:.7em}
#loadtrack{height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
#loadbar{height:100%;width:0;background:var(--sand);transition:width .3s}
#loadmsg{margin-top:12px;font-size:calc(var(--u)*.8);color:var(--ink3)}

/* captures: ?snap=1 skips the fades */
body.snap #loading,body.snap #dh-fade{display:none!important}
/* clean frames (thumbnails / posters): ?clean=1 */
body.clean #labels,body.clean #card,body.clean #bar,body.clean #charts,body.clean #duel,body.clean #time,body.clean #brand,body.clean #dh-bubbles,body.clean #dh-copy,body.clean #toast,body.clean #basin{display:none!important}

/* phones */
@media (max-width:820px), (max-height:500px){
  #card{left:10px;right:10px;width:auto;bottom:118px;padding:14px 16px}
  #card.min #cbody,#card.min #cfact{display:none}
  #cbody{font-size:14px}
  #charts,#brand{display:none}
  #duel{left:10px;right:10px;width:auto;top:auto;bottom:calc(118px + 40vh);display:none}
  #basin{left:10px;right:10px;width:auto;top:70px;bottom:auto;height:42vh}
  #bar{left:8px;right:8px;bottom:8px;gap:6px;flex-wrap:wrap}
  #rail{order:-1;flex:1 1 100%;margin:0 18px;height:50px}
  .stn .n,.anc{display:none}
  .bt{min-width:44px;height:44px}
  #tbig{font-size:28px} #toast{top:64px;font-size:13px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>

<div id="brand"><div class="t">DELTA-Hub</div><div class="s">Danube Delta · Digital Twin</div></div>
<div id="time"><div id="tbig"></div><div id="tsmall"></div></div>
<div id="toast"></div>
<div id="vtick"></div>

<div id="duel" class="glass">
  <div class="row"><div class="side riv"><b id="dRiv"></b><span id="dQ"></span></div><div class="side sea"><b id="dSea"></b><span id="dHs"></span></div></div>
  <div id="tug"><div id="tugR"></div><div id="tugS"></div><div id="tugknob"></div></div>
  <div id="dState"></div>
  <div id="legend"><span><i class="sw dep"></i><span id="lDep"></span></span><span><i class="sw ero"></i><span id="lEro"></span></span><span id="lRef"></span></div>
</div>

<div id="card" class="glass">
  <div id="kicker"></div><div id="ctitle"></div><div id="cbody"></div><div id="cfact"></div>
  <div id="cfocus" style="display:none"></div>
  <div id="chint"></div>
  <div id="cend" style="display:none"></div>
</div>

<div id="charts">
  <div class="chart glass" data-tab="q"><div class="cval"></div><div class="ctit"></div><div class="cunit"></div><svg viewBox="0 0 600 160"></svg></div>
  <div class="chart glass" data-tab="hs"><div class="cval"></div><div class="ctit"></div><div class="cunit"></div><svg viewBox="0 0 600 160"></svg></div>
  <div class="chart glass" data-tab="dv"><div class="cval"></div><div class="ctit"></div><div class="cunit"></div><svg viewBox="0 0 600 230"></svg></div>
</div>

<div id="basin" class="glass">
  <div id="bTitle"></div>
  <div class="bbars">
    <div class="bb"><button class="bt txt" id="bBefore"></button><div class="v" style="width:62%"><span id="bvBefore"></span></div></div>
    <div class="bb"><button class="bt txt on" id="bToday"></button><div class="v" style="width:20.7%"><span id="bvToday"></span></div></div>
  </div>
  <canvas id="bmap"></canvas>
  <div id="bTrap"></div>
</div>

<div id="bar" class="glass">
  <button class="bt" id="btnHome" aria-label="home"></button>
  <button class="bt" id="btnPrev" aria-label="back"></button>
  <div id="rail"><div id="track"><div id="trackfill"></div></div><div id="train"></div></div>
  <button class="bt go" id="btnNext" aria-label="next"></button>
  <button class="bt txt" id="btnLang">EN</button>
  <button class="bt" id="btnData" aria-label="about the data"></button>
</div>


<div id="loading"><div class="w"><div class="t" id="loadt">Lupta de la gură</div><div id="loadtrack"><div id="loadbar"></div></div><div id="loadmsg"></div></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
